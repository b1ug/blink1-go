name: Foundation SDK 17f690d GID785 software validation

"on":
  push:
    branches: [ci/foundation-sdk-17f690d-gid785-20261111]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "1"
  GOWORK: "off"
  GOTOOLCHAIN: local
  GOSUMDB: sum.golang.org
  GONOSUMDB: ""
  GOPRIVATE: ""
  GID_TEST_ENUMERATE: "0"
  GID_TEST_DEVICE_PATH: ""

jobs:
  native:
    if: ${{ github.repository == 'b1ug/blink1-go' && github.ref == 'refs/heads/ci/foundation-sdk-17f690d-gid785-20261111' }}
    name: Foundation17f GID785 / ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SDK_RUNNER_LABEL: ${{ matrix.os }}
      SDK_GO_LINE: ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 17f690dc746c2368f04fbfedfae5fc6cb36b6db5
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify literal payload, dependency and native toolchain
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = 17f690dc746c2368f04fbfedfae5fc6cb36b6db5
          test -z "$(git status --porcelain)"
          test "$GITHUB_REPOSITORY" = b1ug/blink1-go
          test "$GITHUB_REF" = refs/heads/ci/foundation-sdk-17f690d-gid785-20261111
          printf 'Workflow event commit: %s\n' "$GITHUB_SHA"
          printf 'Workflow file commit: %s\n' "$GITHUB_WORKFLOW_SHA"
          printf 'Fixed SDK payload: '
          git rev-parse HEAD
          printf 'Runner label/name/os/arch: %s / %s / %s / %s\n' "$SDK_RUNNER_LABEL" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          case "$SDK_RUNNER_LABEL" in
            ubuntu-24.04|ubuntu-22.04) sdk_goos=linux; sdk_goarch=amd64; sdk_arch=X64 ;;
            ubuntu-24.04-arm) sdk_goos=linux; sdk_goarch=arm64; sdk_arch=ARM64 ;;
            macos-15) sdk_goos=darwin; sdk_goarch=arm64; sdk_arch=ARM64 ;;
            macos-15-intel) sdk_goos=darwin; sdk_goarch=amd64; sdk_arch=X64 ;;
            windows-2022) sdk_goos=windows; sdk_goarch=amd64; sdk_arch=X64 ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_ARCH" = "$sdk_arch"
          test "$(go env GOOS)" = "$sdk_goos"
          test "$(go env GOARCH)" = "$sdk_goarch"
          test "$(go env CGO_ENABLED)" = 1
          case "$SDK_GO_LINE" in
            1.26.x) go version | grep -E 'go1[.]26[.][0-9]+ ' ;;
            1.27.x) go version | grep -E 'go1[.]27[.][0-9]+ ' ;;
            1.13.15) go version | grep -F 'go1.13.15 ' ;;
            *) exit 1 ;;
          esac
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version
          # These are Git source-object hashes, portable across checkout line endings.
          test "$(git rev-parse HEAD:go.mod)" = 2ad456e783cf85f235ac0a82b96424851600cb0e
          test "$(git rev-parse HEAD:go.sum)" = e99b4099af464736611b0c9276d235f2b53010b2
          GOPROXY=direct go mod download -json github.com/b1ug/gid@v0.0.3-0.20261110160506-7858785cfdf0 | tee "$RUNNER_TEMP/gid-download.json"
          grep -F '"Sum": "h1:2V6AH7zqyn4H38Sz5DSIUtm97fdTp2WNX/HYSElcIQE="' "$RUNNER_TEMP/gid-download.json"
          grep -F '"GoModSum": "h1:b9pd+IB3F4qVXRRUOWgux7TWqxceIEGo/mhoBcOp9RM="' "$RUNNER_TEMP/gid-download.json"
          go list -mod=readonly -m -json all
          test "$(go list -mod=readonly -m -f '{{.Version}}|{{if .Replace}}replaced{{else}}no-replace{{end}}' github.com/b1ug/gid)" = 'v0.0.3-0.20261110160506-7858785cfdf0|no-replace'
          test -z "$(go list -mod=readonly -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          go mod verify
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain)"
      - name: Verify fixed GID origin and run distinct software tests without HID access
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gid-module-check.go" <<'GO'
          // CI-only validation of Go's actual dependency download metadata.
          package main

          import (
              "encoding/json"
              "fmt"
              "io/ioutil"
              "os"
              "strings"
          )

          type origin struct{ VCS, URL, Hash string }
          type download struct {
              Path, Version, Sum, GoModSum, Error string
              Origin                            *origin
          }

          func main() {
              if len(os.Args) != 3 || (os.Args[2] != "modern" && os.Args[2] != "legacy") {
                  panic("download JSON and explicit modern/legacy mode required")
              }
              data, err := ioutil.ReadFile(os.Args[1])
              if err != nil {
                  panic(err)
              }
              var value download
              if err = json.Unmarshal(data, &value); err != nil {
                  panic(err)
              }
              valid := value.Error == "" && value.Path == "github.com/b1ug/gid" && value.Version == "v0.0.3-0.20261110160506-7858785cfdf0" && value.Sum == "h1:2V6AH7zqyn4H38Sz5DSIUtm97fdTp2WNX/HYSElcIQE=" && value.GoModSum == "h1:b9pd+IB3F4qVXRRUOWgux7TWqxceIEGo/mhoBcOp9RM="
              originValid := value.Origin != nil && value.Origin.VCS == "git" && strings.TrimSuffix(value.Origin.URL, ".git") == "https://github.com/b1ug/gid" && value.Origin.Hash == "7858785cfdf0ccc811ec3864508e70c5fa95bca8"
              if !valid || (os.Args[2] == "modern" && !originValid) || (value.Origin != nil && !originValid) {
                  fmt.Fprintln(os.Stderr, "GID dependency download does not match the fixed source/version/checksums")
                  os.Exit(1)
              }
              method := "actual-Go-Origin.Hash-and-checksums"
              if os.Args[2] == "legacy" && value.Origin == nil {
                  method = "Go1.13-checksums-bound-to-root-modern-origin-and-source-audit"
              }
              result := map[string]interface{}{
                  "event": "fixed_gid_dependency_download_verified", "mode": os.Args[2],
                  "path": value.Path, "version": value.Version, "sum": value.Sum, "go_mod_sum": value.GoModSum,
                  "expected_commit": "7858785cfdf0ccc811ec3864508e70c5fa95bca8",
                  "origin_field_present": value.Origin != nil, "identity_method": method,
                  "hardware_qualification_claim": false,
              }
              if err = json.NewEncoder(os.Stdout).Encode(result); err != nil {
                  panic(err)
              }
          }
          GO
          go run -mod=readonly "$RUNNER_TEMP/gid-module-check.go" "$RUNNER_TEMP/gid-download.json" modern
          cat > "$RUNNER_TEMP/gid-test-summary.go" <<'GO'
          // A CI-only software-evidence summarizer. It never imports or invokes GID.
          package main

          import (
              "bufio"
              "encoding/json"
              "fmt"
              "os"
              "sort"
              "strconv"
              "strings"
          )

          type event struct{ Action, Package, Test string }

          func main() {
              if len(os.Args) != 3 {
                  panic("test JSON log and exit status required")
              }
              status, err := strconv.Atoi(os.Args[2])
              if err != nil {
                  panic(err)
              }
              input, err := os.Open(os.Args[1])
              if err != nil {
                  panic(err)
              }
              defer input.Close()
              scan := bufio.NewScanner(input)
              scan.Buffer(make([]byte, 4096), 4<<20)
              allowedSkips := map[string]bool{"TestThreadedDevices": true, "TestListAll": true, "TestOpenSelectedDevice": true}
              seen, passedNames := map[string]bool{}, map[string]bool{}
              passed, top, failed, packages, packageSkips, nonJSON := 0, 0, 0, 0, 0, 0
              skipped, unexpectedSkips := []string{}, []string{}
              for scan.Scan() {
                  var row event
                  if json.Unmarshal(scan.Bytes(), &row) != nil {
                      nonJSON++
                      continue
                  }
                  if row.Test == "" {
                      switch row.Action {
                      case "pass":
                          packages++
                      case "fail":
                          failed++
                      case "skip":
                          packageSkips++
                      }
                      continue
                  }
                  if row.Action != "pass" && row.Action != "fail" && row.Action != "skip" {
                      continue
                  }
                  if row.Package != "github.com/b1ug/gid" {
                      panic("unexpected test package")
                  }
                  key := row.Package + "/" + row.Test
                  if seen[key] {
                      panic("duplicate terminal test node")
                  }
                  seen[key] = true
                  switch row.Action {
                  case "pass":
                      passed++
                      passedNames[row.Test] = true
                      if !strings.Contains(row.Test, "/") {
                          top++
                      }
                  case "fail":
                      failed++
                  case "skip":
                      skipped = append(skipped, row.Test)
                      if !allowedSkips[row.Test] {
                          unexpectedSkips = append(unexpectedSkips, row.Test)
                      }
                  }
              }
              if err := scan.Err(); err != nil {
                  panic(err)
              }
              sort.Strings(skipped)
              sort.Strings(unexpectedSkips)
              darwinRequired := os.Getenv("RUNNER_OS") == "macOS"
              darwinPassed := passedNames["TestDarwinStringMetadataTypeBoundary"]
              result := map[string]interface{}{
                  "event": "gid_fixed_dependency_software_test_summary", "wrapper": os.Getenv("GITHUB_SHA"),
                  "workflow_commit": os.Getenv("GITHUB_WORKFLOW_SHA"), "runner": os.Getenv("SDK_RUNNER_LABEL"),
                  "go_line": os.Getenv("SDK_GO_LINE"), "gid_commit": "7858785cfdf0ccc811ec3864508e70c5fa95bca8",
                  "gid_version": "v0.0.3-0.20261110160506-7858785cfdf0", "passed_nodes": passed,
                  "top_level_passed": top, "failed_nodes_or_packages": failed, "passed_packages": packages,
                  "skipped_opt_in_tests": skipped, "unexpected_skips": unexpectedSkips,
                  "skipped_packages": packageSkips, "non_json_lines": nonJSON, "test_exit": status,
                  "darwin_string_type_regression_required": darwinRequired,
                  "darwin_string_type_regression_passed": darwinPassed,
                  "hardware_tests_opted_in": false, "hardware_qualification_claim": false,
              }
              if err := json.NewEncoder(os.Stdout).Encode(result); err != nil {
                  panic(err)
              }
              if status != 0 || passed == 0 || packages != 1 || failed != 0 || packageSkips != 0 || len(unexpectedSkips) != 0 || len(skipped) != len(allowedSkips) || (darwinRequired && !darwinPassed) {
                  fmt.Fprintln(os.Stderr, "GID software test command or bounded evidence did not pass")
                  os.Exit(1)
              }
          }
          GO
          set +e
          go test -mod=readonly -race -json -count=1 -timeout=2m github.com/b1ug/gid 2>&1 | tee "$RUNNER_TEMP/gid-tests.jsonl"
          gid_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          go run -mod=readonly "$RUNNER_TEMP/gid-test-summary.go" "$RUNNER_TEMP/gid-tests.jsonl" "${gid_pipeline_status[0]}"
          test "${gid_pipeline_status[1]}" -eq 0
          go mod verify
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain)"
